[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resource-pack-server"
dynamic = ["version"]
description = "A python based Minecraft resource pack server."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Mooling0602", email = "clemooling@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcdreforged>=2.0.0",
]

[dependency-groups]
dev = ["ruff>=0.15.12", "ty>=0.0.33"]
docs = [
    "sphinx>=6.2.1",
    "sphinx-rtd-theme>=3.0.0",
    "sphinx-autobuild",
    "sphinx-copybutton",
    "sphinx-intl",
    "sphinx-autodoc-typehints",
    "sphinx-prompt",
    "sphinxcontrib-mermaid",
    "sphinx-inline-tabs",
    "sphinx-design",
    "sphinxcontrib-jquery",
]

[tool.hatch.version]
source = "regex"
path = "src/mcdreforged.plugin.json"
pattern = "\"version\"\\s*:\\s*\"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/resource-pack-server"]

[project.scripts]
resource-pack-server = "resource_pack_server.__main__:main"
rps = "resource_pack_server.__main__:main"
